<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Referral Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash Loader -->
  <div id="loader">
    <img src="logo-transparent.png" alt="Logo" class="logo">
    <div class="transition-grid"></div>
  </div>

  <!-- Main Content -->
  <div id="content" style="display:none;">
    <header>
      <h1>UPI Referral Hub</h1>
      <p id="typed-text"></p>
    </header>

    <!-- PhonePe Referral -->
    <section class="app-card">
      <span>PhonePe:</span>
      <a href="https://phon.pe/w2e0n5c3" class="refer-btn">Refer & Earn</a>
    </section>

    <!-- Navi UPI Referral -->
    <section class="app-card">
      <span>Navi UPI:</span>
      <a href="https://r.navi.com/ieF5DE" class="refer-btn">Refer & Earn</a>
    </section>

    <!-- Google Pay Referral -->
    <section class="app-card">
      <span>Google Pay:</span>
      <a href="https://gpay.app.goo.gl/invite-bd7mo9z" class="refer-btn">
        Earn ₹21 on your first payment
      </a>
    </section>

    <!-- Paytm Referral -->
    <section class="app-card">
      <span>Paytm:</span>
      <a href="https://p.paytm.me/xCTH/mp9rtzp6?utmt=090421" class="refer-btn">Refer & Earn</a>
    </section>

    <!-- Placeholder for more apps -->
    <section class="app-card"><span>App 5 (Coming Soon)</span></section>

    <footer>
      <p>For any queries: Ph.No: 9949722953 INDIA</p>
    </footer>
  </div>

  <script>
    window.onload = function() {
      setTimeout(function(){
        document.getElementById("loader").style.opacity = "0";
        setTimeout(function(){
          document.getElementById("loader").style.display = "none";
          document.getElementById("content").style.display = "block";
          typeIntro();
        }, 1500);
      }, 3000);
    };

    function typeIntro() {
      const text = "Hi! I'm your friend SRI GANESH... I created this website from which we can refer and earn money from the following apps.... Don't worry it's not fake and I will give you 50% of the referral amount...";
      let i = 0;
      const speed = 40;
      function typeWriter() {
        if (i < text.length) {
          document.getElementById('typed-text').innerHTML += text.charAt(i);
          i++;
          setTimeout(typeWriter, speed);
        }
      }
      typeWriter();
    }

    const grid = document.querySelector('.transition-grid');
    for(let i=0;i<400;i++){
      const div = document.createElement('div');
      div.style.setProperty('--i', i);
      grid.appendChild(div);
    }
  </script>
</body>
</html>
